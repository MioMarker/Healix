<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://mfjfcfuwjbhqgqmtmhwe.supabase.co https://nuihvxluxdpdjgkvtdih.supabase.co http://127.0.0.1:54321; img-src 'self' data:; frame-ancestors 'none';">
<title>Healix — Sign In</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#B8975A">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
html, body { height: 100%; }
body {
  font-family: var(--B); background: var(--dark); color: var(--cream);
  display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh;
}

/* ── LEFT PANEL ── */
.left {
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 48px; border-right: 1px solid var(--gold-border);
}
.left-bg {
  position: absolute; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 80% 60% at 30% 70%, rgba(184,151,90,.07), transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 20%, rgba(184,151,90,.04), transparent 50%);
}
.left-lines {
  position: absolute; inset: 0; z-index: 0; opacity: .018;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 79px, var(--gold) 80px),
    repeating-linear-gradient(90deg, transparent, transparent 79px, var(--gold) 80px);
}
.left-content { position: relative; z-index: 1; }
.logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.logo-mark { width: 30px; height: 30px; border: 1px solid var(--gold); display: grid; place-items: center; font-size: 12px; color: var(--gold); }
.logo-text { font-family: var(--F); font-size: 20px; font-weight: 300; letter-spacing: .25em; color: var(--cream); }
.left-bottom { position: relative; z-index: 1; }
.left-quote { font-family: var(--F); font-size: clamp(32px, 3.5vw, 52px); font-weight: 300; line-height: 1.1; margin-bottom: 28px; }
.left-quote em { font-style: italic; color: var(--gold); }
/* ── RIGHT PANEL ── */
.right {
  display: flex; align-items: center; justify-content: center;
  padding: 48px; background: var(--dark-2);
}
.form-wrap { width: 100%; max-width: 400px; }
.form-eyebrow { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.form-eyebrow::before { content: ''; display: block; width: 24px; height: 1px; background: var(--gold); }
.form-title { font-family: var(--F); font-size: 42px; font-weight: 300; line-height: 1.05; margin-bottom: 8px; }
.form-title em { font-style: italic; color: var(--gold); }
.form-sub { font-size: 14px; color: var(--cream-dim); margin-bottom: 40px; line-height: 1.6; }

/* Form fields */
.field { margin-bottom: 18px; }
.field-label { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; display: block; }
.field-input {
  width: 100%; background: var(--dark-3); border: 1px solid var(--gold-border);
  color: var(--cream); font-family: var(--B); font-size: 14px;
  padding: 14px 18px; outline: none; transition: border-color .2s;
}
.field-input::placeholder { color: var(--muted); }
.field-input:focus { border-color: var(--gold-focus); }
.field-input.error { border-color: var(--error); }
.field-error { font-size: 11px; color: var(--error); margin-top: 6px; display: none; }
.field-error.show { display: block; }

.field-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.field-row .field-label { margin-bottom: 0; }
.forgot-link { font-size: 11px; color: var(--muted); text-decoration: none; transition: color .2s; letter-spacing: .05em; }
.forgot-link:hover { color: var(--gold); }

/* Submit */
.submit-btn {
  width: 100%; padding: 16px; background: var(--gold); border: none;
  color: var(--dark); font-family: var(--B); font-size: 11px; font-weight: 500;
  letter-spacing: .2em; text-transform: uppercase; cursor: pointer;
  transition: background .25s, transform .2s, box-shadow .25s;
  margin-top: 8px; position: relative;
}
.submit-btn:hover { background: var(--gold-light); transform: translateY(-1px); box-shadow: 0 10px 36px var(--gold-glow); }
.submit-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
.submit-btn .btn-spinner { display: none; width: 14px; height: 14px; border: 2px solid rgba(11,11,11,.3); border-top-color: var(--dark); border-radius: 50%; animation: spin .6s linear infinite; margin: 0 auto; }

.submit-btn.loading .btn-text { display: none; }
.submit-btn.loading .btn-spinner { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Alert */
.form-alert { padding: 14px 18px; border: 1px solid; font-size: 13px; line-height: 1.5; margin-bottom: 20px; display: none; }
.form-alert.show { display: block; }
.form-alert.error { border-color: var(--error-border); background: var(--error-bg); color: var(--error); }
.form-alert.success { border-color: var(--success-border); background: var(--success-bg); color: var(--up); }

/* Divider */
.divider { display: flex; align-items: center; gap: 14px; margin: 24px 0; }
.divider-line { flex: 1; height: 1px; background: var(--gold-border); }
.divider-text { font-size: 11px; color: var(--muted); letter-spacing: .1em; }

/* SIWA + magic link */
.apple-btn {
  width: 100%; padding: 14px; background: #000; color: #fff;
  border: 1px solid #000; font-family: var(--B); font-size: 14px; font-weight: 500;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  cursor: pointer; transition: opacity .2s; margin-bottom: 16px;
}
.apple-btn:hover { opacity: .85; }
.apple-btn:disabled { opacity: .5; cursor: not-allowed; }
.apple-btn svg { flex-shrink: 0; }
.toggle-link {
  display: block; width: 100%; text-align: center; background: none; border: none;
  color: var(--gold); font-family: var(--B); font-size: 12px;
  letter-spacing: .15em; text-transform: uppercase; cursor: pointer;
  padding: 12px 0; transition: color .2s;
}
.toggle-link:hover { color: var(--gold-light); }
.password-field { display: none; }
.password-field.show { display: block; }

/* Switch link */
.switch-link { text-align: center; font-size: 13px; color: var(--cream-dim); margin-top: 24px; }
.switch-link a { color: var(--gold); text-decoration: none; transition: color .2s; }
.switch-link a:hover { color: var(--gold-light); }

/* Animations */
.form-wrap > * { opacity: 0; animation: slideUp .5s ease forwards; }
.form-wrap > *:nth-child(1) { animation-delay: .05s; }
.form-wrap > *:nth-child(2) { animation-delay: .1s; }
.form-wrap > *:nth-child(3) { animation-delay: .15s; }
.form-wrap > *:nth-child(4) { animation-delay: .2s; }
.form-wrap > *:nth-child(5) { animation-delay: .25s; }
.form-wrap > *:nth-child(6) { animation-delay: .3s; }
.form-wrap > *:nth-child(7) { animation-delay: .35s; }
.form-wrap > *:nth-child(8) { animation-delay: .4s; }
.form-wrap > *:nth-child(9) { animation-delay: .45s; }
.form-wrap > *:nth-child(10) { animation-delay: .5s; }
.form-wrap > *:nth-child(11) { animation-delay: .55s; }
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 768px) {
  body { grid-template-columns: 1fr; }
  .left { display: none; }
  .right { padding: 40px 24px; align-items: flex-start; padding-top: 80px; }
}
</style>
</head>
<body>

<!-- LEFT -->
<div class="left">
  <div class="left-bg"></div>
  <div class="left-lines"></div>
  <div class="left-content">
    <a href="index.html" class="logo">
      <div class="logo-mark">H</div>
      <span class="logo-text">HEALIX</span>
    </a>
  </div>
  <div class="left-bottom">
    <p class="left-quote">AI that actually<br><em>knows your body.</em></p>
  </div>
</div>

<!-- RIGHT -->
<div class="right">
  <div class="form-wrap">
    <div class="form-eyebrow">Welcome back</div>
    <h1 class="form-title">Sign in to<br><em>Healix</em></h1>
    <p class="form-sub">Your health intelligence platform. Pick up where you left off.</p>

    <div class="form-alert" id="form-alert"></div>

    <button class="apple-btn" id="apple-btn" onclick="handleApple()">
      <svg width="16" height="18" viewBox="0 0 16 18" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M13.252 9.46c-.022-2.265 1.846-3.353 1.93-3.405-1.053-1.541-2.69-1.752-3.27-1.776-1.39-.141-2.717.819-3.426.819-.71 0-1.804-.797-2.965-.776C4.005 4.343 2.6 5.21 1.835 6.564.226 9.305 1.424 13.34 2.99 15.558c.766 1.086 1.679 2.305 2.876 2.262 1.155-.045 1.591-.745 2.987-.745 1.396 0 1.789.745 3.013.722 1.243-.022 2.03-1.103 2.79-2.197.876-1.265 1.236-2.49 1.257-2.553-.027-.012-2.415-.928-2.44-3.687zM10.99 2.79c.635-.77 1.063-1.84.946-2.905-.916.037-2.024.61-2.68 1.38-.589.683-1.103 1.776-.965 2.82 1.023.08 2.064-.519 2.7-1.295z"/>
      </svg>
      <span>Sign in with Apple</span>
    </button>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">or</span>
      <div class="divider-line"></div>
    </div>

    <div class="field">
      <label class="field-label" for="email">Email address</label>
      <input class="field-input" type="email" id="email" placeholder="you@example.com" autocomplete="email">
      <div class="field-error" id="email-error">Please enter a valid email address.</div>
    </div>

    <div class="field password-field" id="password-field">
      <div class="field-row">
        <label class="field-label" for="password">Password</label>
        <a href="#" class="forgot-link" onclick="showForgot(event)">Forgot password?</a>
      </div>
      <input class="field-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      <div class="field-error" id="password-error">Please enter your password.</div>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="handlePrimary()">
      <span class="btn-text">Send sign-in link</span>
      <div class="btn-spinner"></div>
    </button>

    <button class="toggle-link" id="toggle-mode" onclick="togglePasswordMode()">Use password instead</button>

    <p class="switch-link">Don't have an account? <a href="signup.html">Create one free →</a></p>
  </div>
</div>

<script src="config.js"></script>
<script>
function supabaseRequest(endpoint, method, body) {
  return fetch(SUPABASE_URL + endpoint, {
    method: method || 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
    },
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r) { return r.json(); });
}

function showAlert(msg, type) {
  var el = document.getElementById('form-alert');
  el.textContent = msg;
  el.className = 'form-alert show ' + (type || 'error');
}
function hideAlert() {
  document.getElementById('form-alert').className = 'form-alert';
}

function setLoading(loading) {
  var btn = document.getElementById('submit-btn');
  btn.classList.toggle('loading', loading);
  btn.disabled = loading;
}

function validateEmail(val) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
}

var passwordMode = (function() {
  try { return localStorage.getItem('healix_last_auth_method') === 'password'; } catch (e) { return false; }
})();

function applyPasswordMode() {
  document.getElementById('password-field').classList.toggle('show', passwordMode);
  document.querySelector('#submit-btn .btn-text').textContent = passwordMode ? 'Sign In' : 'Send sign-in link';
  document.getElementById('toggle-mode').textContent = passwordMode ? 'Use a sign-in link instead' : 'Use password instead';
}

function togglePasswordMode() {
  passwordMode = !passwordMode;
  applyPasswordMode();
}

function getRedirectTo() {
  var basePath = window.location.pathname.startsWith('/dev/') ? '/dev/' : '/';
  return window.location.origin + basePath + 'confirm.html';
}

function setLastMethod(method) {
  try { localStorage.setItem('healix_last_auth_method', method); } catch (e) {}
}

function handleApple() {
  // Supabase OAuth web flow → redirects through Apple, returns to confirm.html
  // with #access_token in the URL hash. confirm.html already handles this.
  setLastMethod('apple');
  var redirectTo = encodeURIComponent(getRedirectTo());
  window.location.href = SUPABASE_URL + '/auth/v1/authorize?provider=apple&redirect_to=' + redirectTo;
}

function handlePrimary() {
  hideAlert();
  var email = document.getElementById('email').value.trim();
  var valid = true;

  document.getElementById('email').classList.remove('error');
  document.getElementById('email-error').classList.remove('show');

  if (!validateEmail(email)) {
    document.getElementById('email').classList.add('error');
    document.getElementById('email-error').classList.add('show');
    valid = false;
  }
  if (!valid) return;

  if (passwordMode) {
    handlePasswordLogin(email);
  } else {
    handleMagicLink(email);
  }
}

function handleMagicLink(email) {
  setLoading(true);
  var redirectTo = encodeURIComponent(getRedirectTo());
  // create_user: false — don't silently create accounts from typo'd emails
  // at the login screen. Users with no account see an error from Supabase.
  supabaseRequest('/auth/v1/otp?redirect_to=' + redirectTo, 'POST', {
    email: email,
    create_user: false
  }).then(function(data) {
    setLoading(false);
    if (data.error || data.error_description || data.msg) {
      showAlert(data.error_description || data.msg || data.error || 'Something went wrong. Please try again.');
    } else {
      setLastMethod('magic-link');
      showAlert('Check your email — we sent a sign-in link to ' + email + '. Open it on this device to sign in.', 'success');
    }
  }).catch(function(err) {
    setLoading(false);
    console.error('[Login] Magic link error:', err);
    showAlert('Unable to connect. Please check your connection and try again.');
  });
}

function handlePasswordLogin(email) {
  var password = document.getElementById('password').value;
  document.getElementById('password').classList.remove('error');
  document.getElementById('password-error').classList.remove('show');
  if (!password) {
    document.getElementById('password').classList.add('error');
    document.getElementById('password-error').classList.add('show');
    return;
  }

  setLoading(true);

  supabaseRequest('/auth/v1/token?grant_type=password', 'POST', {
    email: email,
    password: password
  }).then(function(data) {
    setLoading(false);
    if (data.error || data.error_description) {
      showAlert(data.error_description || 'Invalid email or password. Please try again.');
    } else if (data.access_token) {
      localStorage.setItem('healix_session', JSON.stringify({
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expires_at: Date.now() + (data.expires_in || 3600) * 1000,
        user: data.user
      }));
      setLastMethod('password');
      window.location.href = 'dashboard.html';
    } else {
      showAlert('Something went wrong. Please try again.');
    }
  }).catch(function() {
    setLoading(false);
    showAlert('Unable to connect. Please check your connection and try again.');
  });
}

applyPasswordMode();

function showForgot(e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim();
  if (!validateEmail(email)) {
    showAlert('Enter your email address above first, then click Forgot password.');
    return;
  }
  setLoading(true);
  var basePath = window.location.pathname.startsWith('/dev/') ? '/dev/' : '/';
  var redirectUrl = window.location.origin + basePath + 'reset-password.html';
  var redirectParam = encodeURIComponent(redirectUrl);
  supabaseRequest('/auth/v1/recover?redirect_to=' + redirectParam, 'POST', { email: email, redirect_to: redirectUrl })
    .then(function(data) {
      setLoading(false);
      if (data && (data.error || data.error_code || data.msg)) {
        console.error('[Recover] Error:', data);
        showAlert(data.error_description || data.msg || data.error || 'Could not send reset email. Please try again.');
      } else {
        showAlert('Password reset email sent. Check your inbox (and spam folder).', 'success');
      }
    }).catch(function(err) {
      setLoading(false);
      console.error('[Recover] Network error:', err);
      showAlert('Could not send reset email. Please try again.');
    });
}

// Enter key support
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handlePrimary();
});

// Check if already logged in
var session = localStorage.getItem('healix_session');
if (session) {
  try {
    var s = JSON.parse(session);
    if (s.access_token) window.location.href = 'dashboard.html';
  } catch(e) {}
}
</script>
</body>
</html>
